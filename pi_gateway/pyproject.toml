[project]
name = "drowsiness"
version = "0.1.0"
description = "Live drowsiness detector for Raspberry Pi 5 (rpicam-vid + MediaPipe + EAR)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==0.10.18",
    "opencv-python-headless>=4.9",
    "numpy<2",
    "paho-mqtt>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
