# InfluxDB 2 (Flux) datasource. Values come from the grafana service env in docker-compose.yml (from .env).
apiVersion: 1

datasources:
  - name: InfluxDB-car
    uid: influxdb-car
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      timeInterval: 1s
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
