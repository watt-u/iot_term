# On-prem backbone for the car drowsiness detector (runs on the Pi 5, arm64).
# Usage: cp .env.example .env && docker compose up -d
# Data lives in ./data (gitignored). server.py runs on the host, not in Docker.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto:/mosquitto/data
    healthcheck:
      # Subscribe to the broker's own $SYS uptime topic; succeeds once the broker answers.
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      # Only used on the very first start (when ./data/influxdb is empty).
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?set INFLUX_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-iot}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-car}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-30d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
      - ./data/influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana-oss:12.1.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymous read-only access, so the demo laptop/phone opens the dashboard without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/car.json
      # Allow the 1 s dashboard refresh (Grafana's default minimum is 5 s).
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      # Lets the optional text panel embed the MJPEG camera stream (<img src=...>).
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Read by grafana/provisioning/datasources/influxdb.yaml
      INFLUX_ORG: ${INFLUX_ORG:-iot}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-car}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # Named volume (not ./data) because Grafana runs as uid 472 and a root-owned bind mount
      # would fail. Everything important is provisioned from files, so losing it is harmless.
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  grafana-data:
