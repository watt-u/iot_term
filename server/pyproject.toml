[project]
name = "car-server"
version = "0.1.0"
description = "On-prem server for the car drowsiness detector: MQTT -> InfluxDB, alert rules, AI captions"
requires-python = ">=3.11,<3.13"
dependencies = [
    "paho-mqtt>=2",
    "influxdb-client>=1.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
